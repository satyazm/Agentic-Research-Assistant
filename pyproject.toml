[project]
name = "agentic_deep_researcher"
version = "0.1.0"
description = "An agentic research assistant that plans and executes multi-agent workflows over arXiv and Semantic Scholar."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai==1.14.4",
    "crewai-tools==0.76.0",
    "requests>=2.31.0",
    "mcp>=1.6.0",
    "python-dotenv>=1.1.0",
    "streamlit>=1.44.1",
    "pydantic>=2.0.0",
    "setuptools>=82.0.1",
    "google-genai>=1.74.0",
    "matplotlib>=3.10.9",
    "pymupdf>=1.27.2.3",
    "litellm>=1.83.0",
    "arxiv>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
py-modules = ["agentic_crew", "planner", "executor", "task_registry", "utils", "chart_runner", "pdf_sectionalizer", "server"]
packages = ["agents", "tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, UP = pyupgrade, B = bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are common in agent prompts; don't hard-fail on them.

[tool.pytest.ini_options]
testpaths = ["tests"]
